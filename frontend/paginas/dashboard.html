<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Customizacao do autor-->
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="bg-dark">

    <header class="py-3 mb-4 custom-header text-center border-bottom border-secondary">
        <h1 class="text-white">DASHBOARD</h1>
    </header>

    <main class="container">
        <!-- Seção: Formulário e Busca -->
         <section id="formulario" class="mb-5">
            <form id="formBusca" class="row">
                <div class="col-12 col-md-8 mb-3">
                    <label for="inputBusca" class="form-label text-white fw-bold">
                        Buscar Demanda
                    </label>
                    <input type="text" id="inputBusca" class="form-control rounded-pill" placeholder="Digite um título ou descrição">
                    <div id="erroBusca" class="text-danger mt-1 d-none">
                        <small>O campo de busca não pode estar vazio</small>
                    </div>

                    <div class="col-12 col-md-4 mb-3 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold">Buscar</button>
                        <button type="button" class="btn btn-secondary w-100 rounded-pill fw-bold">Filtros</button>
                    </div>
                </div>
            </form>
         </section>

         <!-- Seção: Resumo -->
          <section id="resumo" class="mb-5">
            <h4 class="text-white mb-3">Informações Resumidas</h4>
            <div class="row">
                <div class="col-12 col-sm-6 col-md-3 mb-3">
                    <div class="card text-center h-100 custom-card-mint">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">Total</h5>
                            <p class="card-text fs-2">42</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-md-3 mb-3">
                    <div class="card text-center h-100 custom-card-roxo">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">Em Andamento</h5>
                            <p class="card-text fs-2">15</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-md-3 mb-3">
                    <div class="card text-center h-100 custom-card-mint">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">Críticas Abertas</h5>
                            <p class="card-text fs-2">3</p>
                        </div>
                    </div>
                </div>
            </div>
          </section>

          <!-- Seção: Lista de Demandas -->
           <section id="lista" class="mb-5">
            <div class="row">
                <div class="col-12 col-sm-6 col-md-4 mb-4">
                    <div class="card h-100 text-center custom-demanda-card">
                        <img src="https://pngmagic.com/webp_images/bright-plain-white-background-hd_YA6.webp" class="card-img-top p-3 rounded" alt="Demanda 01">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">Demanda 01</h5>
                            <hr>
                            <p class="card-text">Descrição breve da demanda e seu objetivo principal</p>
                            <span class="badge bg-danger">Crítica</span>
                            <span class="badge bg-warning text-dark">Aberta</span>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-md-4 mb-4">
                    <div class="card h-100 text-center custom-demanda-card">
                        <img src="https://pngmagic.com/webp_images/bright-plain-white-background-hd_YA6.webp" class="card-img-top p-3 rounded" alt="Demanda 01">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">Demanda 02</h5>
                            <hr>
                            <p class="card-text">Descrição breve da demanda 02 e seu objetivo principal</p>
                            <span class="badge bg-primary">Alta</span>
                            <span class="badge bg-warning text-dark">Aberta</span>
                        </div>
                    </div>
                </div>
            </div>
           </section>
    </main>

    <script src="../javascript/dashboard.js" defer></script>
    
</body>
</html>
