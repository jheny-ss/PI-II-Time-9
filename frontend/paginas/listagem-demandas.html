
<!--
Autor: Rafa
Tela: Listagem de Demandas

Os dados da tabela vêm da API (GET /demandas),
preenchidos pelo arquivo listagem-demandas.js.
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listagem de Demandas</title>

    <link rel="stylesheet" href="../css/formulario-demanda.css">
    <link rel="stylesheet" href="../css/listagem-demandas.css">

    <!-- A validação da Reunião 3 deve vir antes da listagem. -->
    <script src="../javascript/sessao.js" defer></script>
    <script src="../javascript/validacao-listagem.js" defer></script>
    <script src="../javascript/listagem-demandas.js" defer></script>
</head>
<body>

    <main>
        <nav class="barra-navegacao">
            <a href="dashboard.html" class="btn btn-secundario">Dashboard</a>
            <span id="nomeUsuarioLogado"></span>
            <button type="button" id="botaoSair" class="btn btn-secundario">Sair</button>
        </nav>

        <h1>Listagem de Demandas</h1>

        <form id="form-filtros" class="barra-filtros">

            <div class="campo">
                <label for="busca">Buscar por título ou descrição</label>
                <input
                    type="text"
                    id="busca"
                    name="busca"
                >
            </div>

            <div class="campo">
                <label for="filtro-status">Status</label>

                <select id="filtro-status" name="status">
                    <option value="">Todos</option>
                    <option value="Aberta">Aberta</option>
                    <option value="Em andamento">Em andamento</option>
                    <option value="Em revisão">Em revisão</option>
                    <option value="Concluída">Concluída</option>
                    <option value="Cancelada">Cancelada</option>
                </select>
            </div>

            <div class="campo">
                <label for="filtro-prioridade">Prioridade</label>

                <select id="filtro-prioridade" name="prioridade">
                    <option value="">Todas</option>
                    <option value="Crítica">Crítica</option>
                    <option value="Alta">Alta</option>
                    <option value="Média">Média</option>
                    <option value="Baixa">Baixa</option>
                </select>
            </div>

            <div class="campo">
                <label for="ordenar-por">Ordenar por</label>

                <select id="ordenar-por" name="ordenarPor">
                    <option value="">Padrão</option>
                    <option value="prioridade">Prioridade</option>
                    <option value="dataCriacao">Data de criação</option>
                    <option value="prazo">Prazo de finalização</option>
                    <option value="status">Status</option>
                </select>
            </div>

            <div class="campo">
                <label for="ordem">Ordem</label>

                <select id="ordem" name="ordem">
                    <option value="asc">Crescente</option>
                    <option value="desc">Decrescente</option>
                </select>
            </div>

            <div class="form-acoes">
                <button type="submit" class="btn btn-primario">
                    Filtrar
                </button>

                <button type="reset" class="btn btn-secundario">
                    Limpar
                </button>
            </div>

        </form>

        <!-- Mensagem de erro da API ou de conexão. -->
        <p
            id="mensagem-erro"
            class="erro-validacao"
            role="alert"
            aria-live="assertive"
            hidden
        ></p>

        <p
            id="resumo-resultados"
            class="resumo-resultados"
            aria-live="polite"
        ></p>

        <div class="tabela-container">
            <table class="tabela-demandas">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Tipo</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Projeto</th>
                        <th>Responsável</th>
                        <th>Criada em</th>
                        <th>Prazo</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <!-- As linhas são criadas pelo JavaScript. -->
                <tbody id="tabela-corpo"></tbody>
            </table>
        </div>

    </main>

</body>
</html>
