<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Customizacao minha-->
    <link rel="stylesheet" href="../css/detalhes.css">
    <title>Detalhes de Demanda</title>
    <script src="../javascript/sessao.js" defer></script>
    <script src="../javascript/detalhes.js" defer></script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Sistema de Demandas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Alternar menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="listagem-demandas.html">Listagem</a>
                    </li>
                    <li class="nav-item">
                        <span id="nomeUsuarioLogado" class="nav-link"></span>
                    </li>
                    <li class="nav-item">
                        <button type="button" id="botaoSair" class="btn btn-outline-light btn-sm">Sair</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="pagina-detalhes">
        <header class="cabecalho">
            <h1>Detalhes</h1>
        </header>

        <p id="mensagemErro" class="erro-detalhes" role="alert" hidden></p>

        <div class="container-detalhes">
            <div class="bloco-esquerda">
                <div class="col-12 col-md-6 bloco-esquerda">
                    <dl>
                        <div class="campo titulo">
                            <dt><h3>Título</h3></dt>
                            <dd id="campoTitulo">-</dd>
                        </div>

                        <div class="campo status">
                            <dt><h3>Status</h3></dt>
                            <dd id="campoStatus">-</dd>
                        </div>

                        <div class="campo prioridade">
                            <dt><h3>Prioridade</h3></dt>
                            <dd id="campoPrioridade">-</dd>
                        </div>

                        <div class="campo descricao">
                            <dt><h3>Descrição</h3></dt>
                            <dd>
                            <textarea id="campoDescricao" readonly></textarea>
                            </dd>
                        </div>
                    </dl>
                </div>
            </div>

            <div class="bloco-direita">
                <div class="col-12 col-md-6 bloco-direita">
                    <dl>
                        <div class="campo tipo">
                            <dt><h3>Tipo</h3></dt>
                            <dd id="campoTipo">-</dd>
                        </div>

                        <div class="campo projeto-associado">
                            <dt><h3>Projeto Associado</h3></dt>
                            <dd id="campoProjeto">-</dd>
                        </div>

                        <div class="campo responsavel">
                            <dt><h3>Responsável</h3></dt>
                            <dd id="campoResponsavel">-</dd>
                        </div>

                        <div class="campo data-criacao">
                            <dt><h3>Data de Criação</h3></dt>
                            <dd id="campoDataCriacao">-</dd>
                        </div>

                        <div class="campo data-atualizacao">
                            <dt><h3>Data de Atualização</h3></dt>
                            <dd id="campoDataAtualizacao">-</dd>
                        </div>

                        <div class="campo campo-prazo">
                            <dt><h3>Prazo</h3></dt>
                            <dd id="campoPrazo">-</dd>
                        </div>
                    </dl>
                </div>
            </div>
        </div>

        <!-- Comentários (Reunião 5): GET/POST /demandas/:id/comentarios -->
        <section class="container-detalhes secao-comentarios">
            <h2>Comentários</h2>
            <ul id="listaComentarios" class="lista-comentarios"></ul>

            <form id="formComentario" class="form-comentario">
                <textarea id="campoNovoComentario" placeholder="Escreva um comentário..." required></textarea>
                <button type="submit" class="btn btn-success">Comentar</button>
                <p id="erroComentario" class="erro-detalhes" hidden></p>
            </form>
        </section>
    </div>

    <footer class="custom-footer text-center py-3">
        <p class="mb-0"> Sistema de Demandas - PI-II Time 9</p>
    </footer>

    <!--Bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
