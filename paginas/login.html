<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">

        <div class="row w-100 justify-content-center">

            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <div class="login-caixa">

                    <div class="login-cabecalho text-center mb-4">
                        <h1>Bem-vindo(a)</h1>
                        <p>Entre para acessar suas demandas</p>
                    </div>

                    <form class="form-login">

                        <div class="campo mb-3">
                            <label for="email" class="form-label">E-mail</label>

                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-control"
                                placeholder="seu@email.com" 
                                required 
                                autocomplete="username"
                            >
                        </div>

                        <div class="campo mb-3">
                            <label for="senha" class="form-label">Senha</label>

                            <input 
                                type="password" 
                                id="senha" 
                                name="senha" 
                                class="form-control"
                                placeholder="Digite sua senha" 
                                required 
                                autocomplete="current-password"
                            >
                        </div>

                        <div class="login-opcoes d-flex justify-content-end mb-4">
                            <a href="#">Esqueci minha senha</a>
                        </div>

                        <div class="d-grid">
                            <button 
                                type="submit" 
                                class="btn btn-primary btn-primario"
                            >
                                Entrar
                            </button>
                        </div>

                    </form>

                    <p class="login-rodape text-center mt-4 mb-0">
                        Não tem uma conta? 
                        <a href="#">Cadastre-se</a>
                    </p>

                </div>

            </div>

        </div>

    </main>

    <!-- JavaScript da validação -->
    <script src="../javascript/login.js" defer></script>


</body>
</html>
